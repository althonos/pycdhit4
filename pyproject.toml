[build-system]
requires = ['scikit-build-core', 'cython ~=3.0', 'scoring-matrices ~=0.3.0']
build-backend = "scikit_build_core.build"

[project]
name = "pycdhit4"
version = "0.1.0-dev.1"
description = "Cython bindings and Python interface to CD-HIT, an accelerated sequence clustering program."
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
  { name = "Martin Larralde", email = "martin.larralde@embl.de" },
]
keywords = ["bioinformatics", "sequence", "clustering", "nucleotide", "protein"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "scoring-matrices ~=0.3.0",
]

[project.urls]
"Homepage" = "https://github.com/althonos/pycdhit4/"
#"Documentation" = "https://pycdhit4.readthedocs.io/en/stable/"
"Bug Tracker" = "https://github.com/althonos/pycdhit4/issues"
"Changelog" = "https://github.com/althonos/pycdhit4/blob/master/CHANGELOG.md"
#"Coverage" = "https://codecov.io/gh/althonos/pycdhit4/"
"Builds" = "https://github.com/althonos/pycdhit4/actions"
"PyPI" = "https://pypi.org/project/pycdhit4"

[project.optional-dependencies]
test = ["importlib-resources ; python_version < '3.9'"]

[tool.scikit-build]
build-dir = "build/{build_type}"
wheel.py-api = "cp310"
editable.rebuild = true
editable.verbose = false
sdist.include = [
    "src",
    "patches",
    "include",
]
sdist.exclude = [
    ".git",
    "data",
    "build",
    "backup",
    "docs",
    "wheelhouse",
    "vendor/cdhit/doc",
]

[[tool.scikit-build.overrides]]
if.state = "editable"
cmake.build-type = "Debug"

[[tool.scikit-build.overrides]]
if.env.READTHEDOCS = "True"
cmake.build-type = "Debug"

[[tool.scikit-build-overrides]]
if.env.SCCACHE = true
cmake.define.CMAKE_C_COMPILER_LAUNCHER = "sccache"
cmake.define.CMAKE_CXX_COMPILER_LAUNCHER = "sccache"

[[tool.scikit-build-overrides]]
if.env.MOLD = true
cmake.define.CMAKE_LINKER_TYPE = "mold"

[tool.cibuildwheel]
before-build = "pip install scikit-build-core cython"
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
build-verbosity = 1
test-command = "python -m unittest pycdhit4.tests -v"
test-extras = ["test"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64"
manylinux-i686-image = "quay.io/pypa/manylinux_2_34_i686"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_34_aarch64"
manylinux-ppc64le-image = "quay.io/pypa/manylinux_2_34_ppc64le"
manylinux-s390x-image = "quay.io/pypa/manylinux_2_34_s390x"

[tool.coverage.run]
plugins = ["Cython.Coverage"]

[tool.coverage.report]
include = ["src/pycdhit/*"]
omit = ["src/pycdhit/tests/*"]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if typing.TYPE_CHECKING:",
    "@abc.abstractmethod",
    "@abc.abstractproperty",
    "raise NotImplementedError",
    "return NotImplemented",
    "raise UnexpectedError",
    "raise AllocationError",
]

[tool.mypy]
disallow_any_decorated = true
disallow_any_generics = true
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true

["tool.mypy-pycdhit.tests"]
ignore_errors = true
